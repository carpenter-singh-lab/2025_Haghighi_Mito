name: mito   

channels:
  - defaults
  - conda-forge

dependencies:
  # ---- Core Python ----
  - python=3.7.16

  # ---- Numeric / data stack  ----
  - numpy=1.18.1          
  - pandas=0.25.2         
  - scipy=1.4.1           
  - scikit-learn=0.22.1   

  # ---- Plotting ----
  - matplotlib=3.1.3      
  - seaborn               

  # ---- YAML / SQL ----
  - pyyaml=5.1.2          
  - sqlalchemy=1.4.39     

  # ---- Jupyter ----
  - ipykernel=5.1.4
  - jupyterlab=3.3.2
  - notebook=6.0.1

  # ---- pip-only packages ----
  - pip
  - pip:
      - scienceplots      
      - hdmedians        
      - blitzgsea        # for GSEA analysis
